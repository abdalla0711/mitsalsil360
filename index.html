<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>نتيجة الثانوية العامة 2026 — ميت سلسيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#FBF6EA; --paper-deep:#F1E9D6; --ink:#1B2A22;
    --green:#1B4332; --green-deep:#0F2E22; --gold:#C6963A;
    --brick:#A14A34; --line:#D8CBA6;
    --shadow: 0 18px 40px -18px rgba(15,46,34,.35);
  }
  *{box-sizing:border-box;}
  body{
    background: radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, var(--paper) 55%, var(--paper-deep) 100%);
    color:var(--ink); font-family:'Tajawal', sans-serif; margin:0; padding:20px 15px; min-height:100vh;
  }
  .wrap{max-width:500px; margin:0 auto;}

  .brandbar{text-align:center; margin-bottom:25px;}
  .village{font-family:'Aref Ruqaa', serif; font-size:32px; color:var(--green-deep); margin:0;}
  .village small{display:block; font-family:'Tajawal'; font-size:13px; color:var(--brick); letter-spacing:2px; font-weight:800;}

  .card{
    background:white; border:1px solid var(--line); border-radius:20px;
    padding:20px; box-shadow:var(--shadow); margin-bottom:15px;
  }

  .tabs{display:flex; background:var(--paper-deep); border-radius:12px; padding:4px; margin-bottom:15px;}
  .tab{flex:1; text-align:center; padding:10px; border-radius:10px; cursor:pointer; font-weight:700; color:#6b7a6f;}
  .tab.active{background:var(--green); color:white;}

  input{
    width:100%; padding:15px; border:2px solid var(--line); border-radius:12px;
    font-family:'Tajawal'; font-size:16px; font-weight:600; outline:none; transition:0.2s;
  }
  input:focus{border-color:var(--green);}

  .btn{
    width:100%; margin-top:12px; padding:15px; border:none; border-radius:12px;
    font-weight:800; font-size:16px; cursor:pointer; font-family:'Tajawal';
    background:var(--green); color:white;
  }
  .btn.gold{background:var(--gold); color:white;}
  .btn.secondary{background:none; border:2px solid var(--green); color:var(--green);}

  /* عرض النتيجة */
  #resultCard{display:none;}
  .cert{border:2px solid var(--gold); border-radius:20px; padding:25px; background:#FFFDF7; text-align:center;}
  .pct-circle{
    width:120px; height:120px; border:4px solid var(--green); border-radius:50%;
    margin:0 auto 15px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .pct-circle .num{font-size:28px; font-weight:800; color:var(--green-deep);}
  .stu-name{font-size:22px; font-weight:800; margin-bottom:5px;}
  .stu-info{font-size:14px; color:#5b6b60; margin-bottom:20px;}
  
  .data-grid{display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px;}
  .data-item{background:var(--paper); padding:12px; border-radius:10px; border:1px solid var(--line);}
  .data-label{font-size:11px; color:var(--brick); font-weight:800; display:block;}
  .data-val{font-size:18px; font-weight:800; color:var(--green-deep);}

  .status-badge{
    display:inline-block; padding:8px 25px; border-radius:99px; 
    font-weight:800; font-size:16px; margin-top:10px;
  }
  .pass{background:#d4edda; color:#155724;}
  .fail{background:#f8d7da; color:#721c24;}

  .links-box{
    margin-top:25px; text-align:center; padding:15px;
    background:rgba(198,150,58,0.1); border-radius:15px; border:1px dashed var(--gold);
  }

  @media print{
    .no-print{display:none !important;}
    body{background:white; padding:0;}
    .cert{border:2px solid #000; box-shadow:none;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="brandbar no-print">
    <h1 class="village">ميت سلسيل 360<small>نتيجة الثانوية العامة 2026</small></h1>
  </div>

  <div class="card no-print" id="searchCard">
    <div class="tabs">
      <div class="tab active" data-tab="seat">رقم الجلوس</div>
      <div class="tab" data-tab="name">بالاسم</div>
    </div>

    <div id="seatPane">
      <input type="tel" id="seatInput" placeholder="أدخل رقم الجلوس هنا...">
      <button class="btn" id="seatBtn">عرض النتيجة</button>
    </div>

    <div id="namePane" style="display:none;">
      <input type="text" id="nameInput" placeholder="أدخل اسم الطالب رباعي...">
      <button class="btn" id="nameBtn">بحث بالاسم</button>
      <div id="matchList" style="margin-top:10px;"></div>
    </div>

    <div id="statusMsg" style="text-align:center; font-size:12px; color:#7c8a80; margin-top:15px;">جاري فحص ملفات النتيجة...</div>
    <input type="file" id="manualFiles" multiple accept=".xlsx" style="display:none;">
    <button class="btn secondary" style="font-size:12px; padding:8px;" onclick="document.getElementById('manualFiles').click()">أو ارفع ملفات Excel يدوياً</button>
  </div>

  <div class="card result-outer" id="resultCard">
    <div class="cert">
      <div class="pct-circle">
        <div class="num" id="resPct">0%</div>
      </div>
      <div class="stu-name" id="resName">--</div>
      <div class="stu-info" id="resSeat">رقم الجلوس: --</div>

      <div class="data-grid">
        <div class="data-item">
          <span class="data-label">المجموع الكلي</span>
          <span class="data-val" id="resTotal">0</span>
          <span style="font-size:11px;">من 320</span>
        </div>
        <div class="data-item">
          <span class="data-label">الحالة</span>
          <div id="resStatus" class="status-badge">--</div>
        </div>
      </div>

      <div style="font-size:11px; color:#8a9089; margin-top:10px;">نتيجة استرشادية - صفحة ميت سلسيل 360</div>
    </div>
    
    <div class="no-print" style="margin-top:15px; display:flex; gap:10px;">
      <button class="btn secondary" onclick="location.reload()">بحث جديد</button>
      <button class="btn gold" onclick="window.print()">طباعة</button>
    </div>
  </div>

  <div class="links-box no-print">
    <p style="font-size:13px; font-weight:700; margin-bottom:10px;">روابط سريعة (اليوم السابع، الوطن، الدستور)</p>
    <button class="btn" style="background:var(--brick);" id="openLinks">🚀 فتح جميع مواقع النتائج الآن</button>
  </div>

  <footer class="no-print" style="text-align:center; font-size:11px; color:#9aa39c; margin-top:20px;">
    تمنياتنا بالنجاح والتفوق لجميع طلاب ميت سلسيل
  </footer>
</div>

<script>
(function(){
  const MAX_TOTAL = 320;
  let students = [];
  const filesToLoad = ['students1.xlsx', 'students2.xlsx'];

  const statusMsg = document.getElementById('statusMsg');

  // معالجة ملفات الأكسل
  function processWorkbook(buffer) {
    const wb = XLSX.read(buffer, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1});
    
    // الأعمدة: 0:رقم الجلوس، 1:المجموع، 2:الاسم، 3:الحالة
    const data = rows.slice(1)
      .filter(r => r[0])
      .map(r => ({
        seat: String(r[0]).trim(),
        total: parseFloat(r[1]) || 0,
        name: String(r[2] || '').trim(),
        status: String(r[3] || 'غير محدد').trim(),
        normName: normalize(String(r[2] || ''))
      }));
    students = students.concat(data);
    statusMsg.textContent = `تم تحميل ${students.length} طالب من الملفات`;
  }

  // تحميل تلقائي
  Promise.all(
    filesToLoad.map(file => 
      fetch('./' + file)
        .then(res => { if(!res.ok) throw new Error(); return res.arrayBuffer(); })
        .then(buf => processWorkbook(buf))
        .catch(() => console.log('ملف غير موجود: ' + file))
    )
  );

  // رفع يدوي
  document.getElementById('manualFiles').addEventListener('change', function(e){
    const files = e.target.files;
    students = []; // مسح القديم
    Array.from(files).forEach(file => {
      const reader = new FileReader();
      reader.onload = (e) => processWorkbook(e.target.result);
      reader.readAsArrayBuffer(file);
    });
  });

  function normalize(s) {
    return s.replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
  }

  function showResult(stu) {
    document.getElementById('searchCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'block';
    
    document.getElementById('resName').textContent = stu.name;
    document.getElementById('resSeat').textContent = "رقم الجلوس: " + stu.seat;
    document.getElementById('resTotal').textContent = stu.total;
    
    const pct = ((stu.total / MAX_TOTAL) * 100).toFixed(2);
    document.getElementById('resPct').textContent = pct + "%";
    
    const statusEl = document.getElementById('resStatus');
    statusEl.textContent = stu.status;
    statusEl.className = 'status-badge ' + (stu.status.includes('دور') || stu.status.includes('راسب') ? 'fail' : 'pass');
  }

  // البحث
  document.getElementById('seatBtn').addEventListener('click', () => {
    const val = document.getElementById('seatInput').value.trim();
    const stu = students.find(s => s.seat === val);
    if(stu) showResult(stu); else alert('رقم الجلوس غير موجود في الملفات المرفوعة');
  });

  document.getElementById('nameBtn').addEventListener('click', () => {
    const val = normalize(document.getElementById('nameInput').value);
    if(val.length < 3) return alert('يرجى كتابة 3 أحرف على الأقل');
    const matches = students.filter(s => s.normName.includes(val));
    
    const list = document.getElementById('matchList');
    list.innerHTML = '';
    
    if(matches.length === 1) {
      showResult(matches[0]);
    } else if(matches.length > 1) {
      matches.slice(0, 15).forEach(m => {
        const d = document.createElement('div');
        d.className = 'card'; d.style.padding = '10px'; d.style.cursor = 'pointer'; d.style.marginBottom = '5px';
        d.innerHTML = `<div style="font-size:14px; font-weight:700;">${m.name}</div><div style="font-size:12px; color:var(--gold)">رقم الجلوس: ${m.seat}</div>`;
        d.onclick = () => showResult(m);
        list.appendChild(d);
      });
    } else {
      alert('لم يتم العثور على هذا الاسم');
    }
  });

  // الروابط
  document.getElementById('openLinks').addEventListener('click', () => {
    const links = [
      'https://natega.youm7.com/',
      'https://www.dostor.org/',
      'https://natega.elwatannews.com/',
      'https://thanwya.emis.gov.eg/'
    ];
    links.forEach(l => window.open(l, '_blank'));
  });

  // التبويبات
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('seatPane').style.display = this.dataset.tab === 'seat' ? 'block' : 'none';
    document.getElementById('namePane').style.display = this.dataset.tab === 'name' ? 'block' : 'none';
  }));
})();
</script>

</body>
</html>
